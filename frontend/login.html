<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Stock Market Prediction</title>
  <link rel="stylesheet" href="css/style.css" />
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>

<body>
  <div class="fixed-top-right">
    <button id="themeToggle" class="btn btn-secondary" type="button" title="Toggle Theme">
      <span id="themeIcon">☀️</span>
    </button>
  </div>
  <div class="centered">
    <div class="card" style="max-width: 520px; width: 100%;">
      <h1 style="margin-top:0;">Login</h1>

      <form id="loginForm" class="form">
        <div id="credentialsSection">
          <label>
            Email
            <input type="email" name="email" id="loginEmail" required placeholder="you@example.com" />
          </label>
          <label>
            Password
            <div class="password-wrapper">
              <input type="password" name="password" id="loginPassword" required placeholder="••••••" />
              <button type="button" class="password-toggle-btn" aria-label="Show password" title="Show password">
                <svg class="eye-icon eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-icon eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </label>
        </div>

        <div id="otpSection" style="display: none;">
          <label>
            Enter 6-digit OTP (Check Email)
            <input type="text" name="otp" id="loginOtpInput" placeholder="123456" maxlength="6" pattern="[0-9]{6}" />
          </label>
        </div>

        <button class="btn" type="submit" id="loginSubmitBtn">Login</button>

        <p style="margin: 10px 0 0; text-align: right;">
          <a href="forgot-password.html" style="font-size: 0.98em;">Forgot password?</a>
        </p>

        <p id="loginMsg" class="msg"></p>

        <p class="muted" style="margin-bottom:0;">
          Don’t have an account?
          <a href="register.html">Register</a>
        </p>
      </form>
    </div>
  </div>

  <script src="js/auth.js?v=3"></script>
</body>

</html>
