<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Stock Market Prediction</title>
    <link rel="stylesheet" href="css/style.css" />
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
      })();
    </script>
  </head>
  <body>
    <div class="fixed-top-right">
      <button id="themeToggle" class="btn btn-secondary" type="button" title="Toggle Theme">
        <span id="themeIcon">☀️</span>
      </button>
    </div>
    <div class="centered">
      <div class="card" style="max-width: 520px; width: 100%;">
        <h1 style="margin-top:0;">Reset Password</h1>
        <form id="resetForm" class="form">
          <input type="hidden" name="token" id="resetToken" />
          <label>
            New Password
            <div class="password-wrapper">
              <input type="password" name="password" id="resetPassword" required placeholder="Enter new password" minlength="6" />
              <button type="button" class="password-toggle-btn" aria-label="Show password" title="Show password">
                <svg class="eye-icon eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-icon eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </label>
          <button class="btn" type="submit">Reset Password</button>
          <p id="resetMsg" class="msg"></p>
        </form>
        <p class="muted" style="margin-bottom:0;">
          <a href="login.html">Back to Login</a>
        </p>
      </div>
    </div>
    <script src="js/reset.js"></script>
  </body>
</html>
